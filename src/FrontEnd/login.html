<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NoisCode</title>
    <link rel="stylesheet" href="/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-code logo-icon"></i>
                    <span>NoisCode</span>
                </div>
                <h1>Bem-vindo de volta!</h1>
                <p>Entre na sua conta para conectar com devs brasileiros</p>
            </div>

            <div id="loginError" class="error-message" style="display: none;"></div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="seu@email.com">
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="password-container">
                        <input type="password" id="senha" name="senha" class="form-control" required placeholder="Digite sua senha">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="lembrar">
                        Lembrar-me
                    </label>
                    <a href="#" class="forgot-password">Esqueci minha senha</a>
                </div>

                <!-- reCAPTCHA Simples -->
                <div class="captcha-container">
                    <div class="captcha-box">
                        <label class="captcha-label">
                            <input type="checkbox" id="captcha" required>
                            <span class="checkmark"></span>
                            Não sou um robô
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    Entrar
                </button>

                <div class="separator">
                    <span>ou continue com</span>
                </div>

                <div class="social-login">
                    <button type="button" class="btn-social btn-google" id="googleLogin">
                        <i class="fab fa-google"></i>
                        Google
                    </button>
                    <button type="button" class="btn-social btn-github" id="githubLogin">
                        <i class="fab fa-github"></i>
                        GitHub
                    </button>
                </div>
            </form>

            <div class="auth-footer">
                <p>Não tem uma conta? <a href="/cadastro" class="auth-link">Cadastre-se aqui</a></p>
                <p><a href="/" class="auth-link">← Voltar para Home</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
</body>
</html>
